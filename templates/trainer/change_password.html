{% extends "base.html" %}

{% block title %}Change Password — {{ settings.gym_name }}{% endblock %}
{% block page_title %}Trainer Security Settings{% endblock %}

{% block content %}
<div style="max-width:540px; margin:0 auto;">
  <div class="card">
    <div class="card-header">
      <div>
        <h3 class="card-title">Change Trainer Password</h3>
        <p class="card-subtitle">Update your coach portal login credentials.</p>
      </div>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('trainer.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group mb-3">
          <label class="form-label">Current Password *</label>
          <input type="password" name="current_password" class="form-input" required autocomplete="current-password" autofocus>
        </div>

        <div class="form-group mb-3">
          <label class="form-label">New Password * (Min 6 characters)</label>
          <input type="password" name="new_password" class="form-input" required autocomplete="new-password">
        </div>

        <div class="form-group mb-4">
          <label class="form-label">Confirm New Password *</label>
          <input type="password" name="confirm_password" class="form-input" required autocomplete="new-password">
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
          <a href="{{ url_for('trainer.dashboard') }}" class="btn btn-outline">Cancel</a>
          <button type="submit" class="btn btn-primary" style="font-weight:700;">Update Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
